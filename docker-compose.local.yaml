# Local "prod-like" stack — same containers as prod, minus Caddy/HTTPS.
# Access the app at http://localhost:8080
#
# Requires credit-tracker-frontend to be cloned as a sibling folder.
#
# Start:   docker compose -f docker-compose.local.yaml up -d --build
# Stop:    docker compose -f docker-compose.local.yaml down
# Rebuild: docker compose -f docker-compose.local.yaml up -d --build --force-recreate
# Logs:    docker compose -f docker-compose.local.yaml logs -f <service>
#          (service names: postgres, app, frontend)

services:
  postgres:
    image: postgres:17
    container_name: shiv-local-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"                 # exposed so you can still psql from host if needed
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build: .                        # same Dockerfile as prod
    container_name: shiv-local-app
    env_file:
      - .env
    environment:
      DB_HOST: postgres             # talk to DB by service name inside the network
      DB_PORT: 5432
    expose:
      - "8000"                      # NOT published to host — only reachable via frontend proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../credit-tracker-frontend
      args:
        # Same-origin calls. Frontend's nginx will proxy /api/* to app:8000.
        VITE_API_URL: /api
    container_name: shiv-local-frontend
    ports:
      - "8080:80"                   # visit http://localhost:8080
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-local-data:
